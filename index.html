<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Press Button</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* Transparent background */
    background: transparent;
}

/* Red push button style */
.button {
    background: red;
    color: white;
    font-size: 24px;
    padding: 20px 50px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 darkred;
    transition: all 0.1s ease;
}

/* Press effect */
.button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 darkred;
}
</style>
</head>

<body>

<button class="button" onclick="goToSite()">Press</button>

<script>
function goToSite() {
    window.location.href = "https://example.com"; // change this link
}
</script>

</body>
</html>
